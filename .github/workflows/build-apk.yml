
name: IndriAstiGPS-baru.zip

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: | 
          unzip -o IndriAstiGPS-baru.zip -d source
          test -f source/IndriAstiGPS-Android/settings.gradle.kts

      - name: Fix geolocation Kotlin code
        run: |
          FILE="source/IndriAstiGPS-Android/app/src/main/java/id/indriasti/gpscamera/MainActivity.kt"
          sed -i 's/geolocationEnabled = true/setGeolocationEnabled(true)/' "$FILE"
          grep -n 'setGeolocationEnabled(true)' "$FILE"

      - name: Build debug APK
        working-directory: source/IndriAstiGPS-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IndriAstiGPSCamera-debug-apk
          path: source/IndriAstiGPS-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
